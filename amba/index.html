<style>
  :root {
    --bg-0: #0a0612;
    --bg-1: #1a0d2e;
    --bg-2: #2a1248;
    --fg: #f5f1ff;
    --fg-dim: #b8a8d4;
    --card: rgba(255,255,255,0.06);
    --card-hover: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.10);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {

    color: var(--fg);
    background: var(--bg-0);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, var(--bg-2) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 100%, #3d1a5c 0%, transparent 60%),

    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 460px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .cover {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
    margin-top: 8px;
  }
  .cover img { width: 100%; height: 100%; display: block; object-fit: cover; }

  h1 {
    font-size: 22px;
    line-height: 1.3;
    font-weight: 700;
    margin: 24px 0 6px;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .artist {
    color: var(--fg-dim);
    font-size: 15px;
    margin: 0 0 24px;
    text-align: center;
  }

  .video {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 20px 40px -16px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
    margin-bottom: 28px;
  }
  .video iframe { width: 100%; height: 100%; border: 0; display: block; }

  .links { width: 100%; display: flex; flex-direction: column; gap: 10px; }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--fg);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.15s ease, transform 0.15s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .link:hover { background: var(--card-hover); transform: translateY(-1px); }
  .link.disabled {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }
  .link .icon { flex: 0 0 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .link .label { flex: 1; }
  .link .meta { color: var(--fg-dim); font-size: 12px; font-weight: 500; }
  .link .arrow { color: var(--fg-dim); font-size: 18px; }

  footer {
    margin-top: 36px;
    color: var(--fg-dim);
    font-size: 12px;
    text-align: center;
    opacity: 0.7;
  }
  footer a { color: var(--fg-dim); }

  @media (max-width: 380px) {
    h1 { font-size: 19px; }
    .link { padding: 13px 14px; font-size: 14px; }
  }
</style>
